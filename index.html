<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Brawler - 1단계</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/dmg.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<div class="game">
  <canvas id="screen"></canvas>
  <!-- 그림 불러오는 막대 (main.js: 처음 + 옷 바꿀 때 작은 표시) -->
  <div class="loading" id="loading"><div class="lbar"><i></i></div><span>그림 불러오는 중…</span></div>

  <!-- 위: 캐릭터·직업 고르기 (견습 = 전직 전 맨손, 기사 = 검, 법사 = 지팡이). 좁은 폰 화면에서는 괄호 부분(.sub)을 숨김 -->
  <div class="topbar">
    <div class="seg" aria-label="캐릭터">
      <button type="button" data-char="male" class="on">남</button>
      <button type="button" data-char="female">여</button>
    </div>
    <div class="seg" aria-label="직업">
      <button type="button" data-class="novice" class="on">견습<span class="sub">(맨손)</span></button>
      <button type="button" data-class="knight">기사<span class="sub">(검)</span></button>
      <button type="button" data-class="mage">법사<span class="sub">(지팡이)</span></button>
      <!-- 도끼 다시 켜기: 아래 주석을 풀고 js/config.js 의 classes 에서 axe 줄 주석도 푼다 -->
      <!-- <button type="button" data-class="axe">도끼</button> -->
    </div>
    <!-- 연습장(허수아비) ↔ 1단계 판 -->
    <a class="modebtn" id="modeBtn" href="?mode=practice">연습장</a>
  </div>

  <!-- 1단계 판 화면 위 글자: 체력 막대, 보스 막대, GO, 알림 (게임 화면 크기에 맞춰 main.js 가 위치를 잡음) -->
  <div class="hud" id="hud" hidden>
    <div class="php"><span class="lbl">HP</span><div class="bar"><em id="pHpLag"></em><i id="pHp"></i></div><span class="num" id="pHpNum">150</span></div>
    <div class="stageinfo" id="stageInfo"></div>
    <div class="bossbar" id="bossBar" hidden><span id="bossName">오크 족장</span><div class="bar"><em id="bHpLag"></em><i id="bHp"></i></div></div>
    <div class="go" id="goPrompt" hidden>GO →</div>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="result" id="result" hidden>
    <div class="box">
      <h2 id="resTitle">STAGE CLEAR!</h2>
      <p id="resStats"></p>
      <div class="rbtns"><button type="button" id="btnRetry">다시 하기</button><a id="resPractice" href="?mode=practice">연습장</a></div>
    </div>
  </div>
  <div class="combo" id="combo" hidden></div>
  <div class="keyhint">이동 ←↑↓→ / WASD · 공격 J / Z (연타 3타)<span class="skkeys"> · 기술 U / C <span class="skchip" data-skill="A" hidden><span class="ic"></span><b class="sec"></b></span> · I / V <span class="skchip" data-skill="B" hidden><span class="ic"></span><b class="sec"></b></span></span></div>

  <!-- 폰 조작 -->
  <div class="joyzone" id="joyZone">
    <div class="joy" id="joy"><i id="joyKnob"></i></div>
  </div>
  <div class="btns">
    <button type="button" class="btn jump" id="btnJump" disabled aria-label="점프(준비 중)">점프</button>
    <button type="button" class="btn atk" id="btnAtk" aria-label="공격">공격</button>
    <!-- 기술 A/B (기사·법사만 보임, 견습은 숨김). 쿨타임 중엔 어둡고 남은 초 표시 (skills.js 의 ui) -->
    <button type="button" class="btn sk skA" id="btnSkA" data-skill="A" hidden aria-label="기술 A"><i class="sweep"></i><span class="ic"></span><b class="sec"></b></button>
    <button type="button" class="btn sk skB" id="btnSkB" data-skill="B" hidden aria-label="기술 B"><i class="sweep"></i><span class="ic"></span><b class="sec"></b></button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/input.js"></script>
<script src="js/fx.js"></script>
<script src="js/entities.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/skills.js"></script>
<script src="js/enemies.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
