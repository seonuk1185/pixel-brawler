<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Brawler - 한 방 손맛</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game">
  <canvas id="screen"></canvas>

  <!-- 위: 캐릭터·직업 고르기 (견습 = 전직 전 맨손, 기사 = 검) -->
  <div class="topbar">
    <div class="seg" aria-label="캐릭터">
      <button type="button" data-char="male" class="on">남</button>
      <button type="button" data-char="female">여</button>
    </div>
    <div class="seg" aria-label="직업">
      <button type="button" data-class="novice" class="on">견습(맨손)</button>
      <button type="button" data-class="knight">기사(검)</button>
      <!-- 도끼 다시 켜기: 아래 주석을 풀고 js/config.js 의 classes 에서 axe 줄 주석도 푼다 -->
      <!-- <button type="button" data-class="axe">도끼</button> -->
    </div>
  </div>
  <div class="combo" id="combo" hidden></div>
  <div class="keyhint">이동 ←↑↓→ / WASD · 공격 J / Z (연타 3타)</div>

  <!-- 폰 조작 -->
  <div class="joyzone" id="joyZone">
    <div class="joy" id="joy"><i id="joyKnob"></i></div>
  </div>
  <div class="btns">
    <button type="button" class="btn jump" id="btnJump" disabled aria-label="점프(준비 중)">점프</button>
    <button type="button" class="btn atk" id="btnAtk" aria-label="공격">공격</button>
  </div>

  <div class="rotate"><p>휴대폰을 <b>가로</b>로 돌려 주세요</p></div>
</div>

<script src="js/config.js"></script>
<script src="js/assets.js"></script>
<script src="js/input.js"></script>
<script src="js/fx.js"></script>
<script src="js/entities.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
