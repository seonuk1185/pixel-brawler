<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pixel Brawler - 1단계</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="fonts/dmg.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<div class="game">
  <canvas id="screen"></canvas>
  <!-- 그림 불러오는 막대 (main.js: 처음 + 옷 바꿀 때 작은 표시) -->
  <div class="loading" id="loading"><div class="lbar"><i></i></div><span>그림 불러오는 중…</span></div>

  <!-- 위: 캐릭터·직업 고르기 (견습 = 전직 전 맨손, 기사 = 검, 법사 = 지팡이). 좁은 폰 화면에서는 괄호 부분(.sub)을 숨김 -->
  <div class="topbar">
    <div class="seg" aria-label="캐릭터">
      <button type="button" data-char="male" class="on">남</button>
      <button type="button" data-char="female">여</button>
    </div>
    <!-- 직업 버튼은 시험 도구(2026-11-06): CFG.stagesAllOpen 이 true 일 때만 보임. 눌러도 저장된 직업(전직)은 안 바뀜 -->
    <div class="seg" id="classSeg" aria-label="직업">
      <button type="button" data-class="novice" class="on">견습<span class="sub">(맨손)</span></button>
      <button type="button" data-class="knight">기사<span class="sub">(검)</span></button>
      <button type="button" data-class="mage">법사<span class="sub">(지팡이)</span></button>
      <!-- 도끼 다시 켜기: 아래 주석을 풀고 js/config.js 의 classes 에서 axe 줄 주석도 푼다 -->
      <!-- <button type="button" data-class="axe">도끼</button> -->
    </div>
    <!-- 연습장(허수아비) ↔ 스테이지 판 -->
    <a class="modebtn" id="modeBtn" href="?mode=practice">연습장</a>
  </div>

  <!-- 스테이지 판 화면 위 글자: 체력 막대, 보스 막대, GO, 알림 (게임 화면 크기에 맞춰 main.js 가 위치를 잡음) -->
  <div class="hud" id="hud" hidden>
    <div class="php"><span class="lbl">HP</span><div class="bar"><em id="pHpLag"></em><i id="pHp"></i></div><span class="num" id="pHpNum">150</span></div>
    <!-- 마나(MP, 2026-11-06): 체력 밑 파란 막대. 기술을 쓰면 줄어듦(성장 4단계) -->
    <div class="pmp"><span class="lbl">MP</span><div class="bar"><i id="pMp"></i></div><span class="num" id="pMpNum">40</span></div>
    <!-- 레벨 + 얇은 경험치 막대 (성장 2026-11-05, main.js updateHud) -->
    <div class="plv"><span class="lv" id="pLv">Lv 1</span><div class="xbar"><i id="pXp"></i></div>
      <!-- 능력치 창 · 기술 창 열기 (2026-11-06): 안 쓴 점수가 있으면 빨간 숫자 표시(.badge). 기술 버튼은 전직한 직업만 -->
      <span class="hbtns"><button type="button" class="statbtn" id="btnStat" aria-label="능력치">능력치<b class="badge" hidden></b></button><button type="button" class="statbtn skbtn" id="btnSkill" aria-label="기술" hidden>기술<b class="badge" hidden></b></button></span></div>
    <div class="stageinfo" id="stageInfo"></div>
    <div class="bossbar" id="bossBar" hidden><span id="bossName">오크 족장</span><div class="bar"><em id="bHpLag"></em><i id="bHp"></i></div></div>
    <div class="go" id="goPrompt" hidden>GO →</div>
    <div class="banner" id="banner" hidden></div>
  </div>
  <div class="result" id="result" hidden>
    <div class="box">
      <h2 id="resTitle">STAGE CLEAR!</h2>
      <p id="resStats"></p>
      <!-- 다음 스테이지(클리어, 마지막 판 아니면) · 다시 하기(같은 판) · 스테이지 고르기 · 연습장. 키보드 ←→ 고르기 + Enter/J -->
      <div class="rbtns"><button type="button" id="btnNext" hidden>다음 스테이지 →</button><button type="button" id="btnRetry">다시 하기</button><button type="button" class="sub" id="btnSel">스테이지 선택</button><button type="button" class="sub statopen" id="btnResStat">능력치<b class="badge" hidden></b></button><button type="button" class="sub statopen skopen" id="btnResSkill" hidden>기술<b class="badge" hidden></b></button><a id="resPractice" href="?mode=practice">연습장</a></div>
    </div>
  </div>
  <!-- 스테이지 고르기 (처음 + 결과 화면에서). 판 버튼은 main.js 가 CFG.stages 로 만듦. 위 고르기 버튼(남/여·직업)은 이 위에 그대로 보임 -->
  <div class="stagesel" id="stageSel" hidden>
    <div class="box">
      <h2>스테이지 선택</h2>
      <div class="slist" id="stageList"></div>
      <div class="rbtns stbtns"><button type="button" class="sub statopen" id="btnSelStat">능력치<b class="badge" hidden></b></button><button type="button" class="sub statopen skopen" id="btnSelSkill" hidden>기술<b class="badge" hidden></b></button></div>
      <p class="shint">←→ 고르기 · Enter / J 시작</p>
    </div>
  </div>
  <!-- 전직 화면 (2026-11-06): 2단계 보스를 처음 깨면 한 번. 카드는 main.js 가 CFG.classChange 로 만듦(기사·법사 = 그 옷 입고 움직이는 모습, 나머지 = 준비 중).
       카드를 고르고 → 아래 「전직하기」(바꿀 수 없어요) → 저장칸에 직업 저장 -->
  <div class="classsel" id="classSel" hidden>
    <div class="box">
      <h2>전직</h2>
      <p class="chint">견습 시절은 끝! 앞으로 함께할 직업을 고르세요. <b>한 번 고르면 바꿀 수 없어요.</b></p>
      <div class="clist" id="classList"></div>
      <div class="rbtns"><button type="button" id="btnClassOk" disabled>직업을 골라 주세요</button></div>
    </div>
  </div>
  <!-- 능력치 창 (2026-11-06): 레벨업마다 3점 → + 로 올림 · 자동 배분 · 초기화(공짜). 여는 동안 게임 멈춤. 줄은 main.js 가 만듦 -->
  <div class="statpanel" id="statPanel" hidden>
    <div class="box">
      <h2>능력치</h2>
      <p class="spts">남은 점수 <b id="statPts">0</b><span id="statSum"></span></p>
      <div class="srows" id="statRows"></div>
      <div class="rbtns"><button type="button" id="btnStatAuto">자동 배분</button><button type="button" class="sub" id="btnStatReset">초기화</button><button type="button" class="sub" id="btnStatClose">닫기</button></div>
    </div>
  </div>
  <!-- 기술 창 (2026-11-06 성장 4단계): 위 = 기술 칸(키 이름), 아래 = 기술 10개(+ 로 기술 Lv 올리기 · 칸 번호로 끼우기). 줄은 main.js 가 만듦 -->
  <div class="statpanel skillpanel" id="skillPanel" hidden>
    <div class="box">
      <h2>기술</h2>
      <p class="spts">남은 기술 점수 <b id="skPts">0</b><span id="skSum"></span></p>
      <div class="skbar" id="skBar"></div>
      <div class="skrows" id="skRows"></div>
      <div class="rbtns"><button type="button" class="sub" id="btnSkReset">초기화</button><button type="button" class="sub" id="btnSkClose">닫기</button></div>
    </div>
  </div>
  <div class="combo" id="combo" hidden></div>
  <div class="keyhint">이동 ←↑↓→ / WASD · 달리기 ←← / →→ · 점프 K / X / Space · 공격 J / Z (연타 3타)<span class="skkeys"> · 기술 <span class="skchip" data-skill="A" hidden><kbd>U</kbd><span class="ic"></span><b class="sec"></b></span><span class="skchip" data-skill="B" hidden><kbd>I</kbd><span class="ic"></span><b class="sec"></b></span><span class="skchip" data-skill="C" hidden><kbd>O</kbd><span class="ic"></span><b class="sec"></b></span><span class="skchip" data-skill="D" hidden><kbd>P</kbd><span class="ic"></span><b class="sec"></b></span><span class="alt">(왼손 C V B N)</span></span></div>

  <!-- 폰 조작 -->
  <div class="joyzone" id="joyZone">
    <div class="joy" id="joy"><i id="joyKnob"></i></div>
  </div>
  <div class="btns">
    <button type="button" class="btn jump" id="btnJump" aria-label="점프">점프</button>
    <button type="button" class="btn atk" id="btnAtk" aria-label="공격">공격</button>
    <!-- 기술 칸 A~D (기사·법사만, 견습은 숨김. C·D 는 Lv13 부터). 쿨타임 중엔 어둡고 남은 초, 마나가 모자라면 회색 + 밑에 드는 마나 (skills.js 의 ui) -->
    <button type="button" class="btn sk skA" id="btnSkA" data-skill="A" hidden aria-label="기술 1"><i class="sweep"></i><span class="ic"></span><b class="sec"></b><small class="mp"></small></button>
    <button type="button" class="btn sk skB" id="btnSkB" data-skill="B" hidden aria-label="기술 2"><i class="sweep"></i><span class="ic"></span><b class="sec"></b><small class="mp"></small></button>
    <button type="button" class="btn sk skC" id="btnSkC" data-skill="C" hidden aria-label="기술 3"><i class="sweep"></i><span class="ic"></span><b class="sec"></b><small class="mp"></small></button>
    <button type="button" class="btn sk skD" id="btnSkD" data-skill="D" hidden aria-label="기술 4"><i class="sweep"></i><span class="ic"></span><b class="sec"></b><small class="mp"></small></button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/growth.js"></script>
<script src="js/assets.js"></script>
<script src="js/input.js"></script>
<script src="js/fx.js"></script>
<script src="js/fxdraw.js"></script>
<script src="js/entities.js"></script>
<script src="js/projectiles.js"></script>
<script src="js/skills.js"></script>
<script src="js/enemies.js"></script>
<script src="js/props.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
